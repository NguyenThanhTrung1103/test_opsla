name: Tests and SonarQube (no deploy)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-sonar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Automated tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify build artifact
        run: test -s dist/index.html
  credential-alert:
    name: Frontend credential alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Detect credential traps and production leaks (redacted)
        run: node scripts/ci/credential-alert.mjs
  sonarqube:
    name: SonarQube via HTTPS
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://test-sonarqube.trungnt.me
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || github.event.repository.name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify SonarQube Secrets
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing."
            exit 1
          fi
          echo "All SonarQube secrets present."

      - name: Verify HTTPS endpoint
        run: |
          curl -fsS --retry 3 --connect-timeout 5 --max-time 20 "$SONAR_HOST_URL/api/system/status" | jq -e '.status == "UP"'
      - name: Execute SonarQube Scanner CLI
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e SONAR_USER_HOME=/tmp/sonar \
            -e SONAR_HOST_URL -e SONAR_TOKEN \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.sources=src,oops_la_book_store_uxui_fixed.html,tests/fixtures/security-demo \
            -Dsonar.tests=tests \
            '-Dsonar.test.exclusions=tests/fixtures/**'

      # Follow this scan's task. Findings warn; scanner/task errors fail.
      - name: Report Quality Gate (findings are alerts)
        run: |
          CE_ID=$(grep '^ceTaskId=' .scannerwork/report-task.txt | cut -d= -f2-)
          test -n "$CE_ID"
          TASK_STATUS=""
          for _ in $(seq 1 60); do
            TASK=$(curl -fsS --connect-timeout 5 --max-time 10 -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/ce/task?id=$CE_ID")
            TASK_STATUS=$(echo "$TASK" | jq -r '.task.status')
            case "$TASK_STATUS" in SUCCESS|FAILED|CANCELED) break ;; esac
            sleep 5
          done
          if [ "$TASK_STATUS" != "SUCCESS" ]; then
            echo "::error::SonarQube background task did not succeed (status: $TASK_STATUS)"
            exit 1
          fi
          AID=$(echo "$TASK" | jq -er '.task.analysisId | select(length > 0)')
          QG=$(curl -fsS --connect-timeout 5 --max-time 10 -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?analysisId=$AID" | jq -r '.projectStatus.status')
          echo "### SonarQube Quality Gate: **$QG**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$QG" = "ERROR" ]; then
            echo "::warning::SonarQube Quality Gate failed; intentional traps retained. Review findings in SonarQube."
          elif [ "$QG" != "OK" ]; then
            echo "::error::Unexpected SonarQube Quality Gate status: $QG"
            exit 1
          fi
