name: CI Scan and Worker Deploy
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested revision to Cloudflare Worker
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: test-sonar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Automation Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Automation Tests (npm test)
        shell: bash
        run: |
          mkdir -p test-results
          npm test 2>&1 | tee test-results/automation-tests.log
      - name: Publish Automation Test Summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const log = fs.existsSync('test-results/automation-tests.log')
            ? fs.readFileSync('test-results/automation-tests.log', 'utf8') : '';
          const count = name => log.match(new RegExp('^# ' + name + ' (\\d+)\\s*$', 'm'))?.[1] ?? 'Not reported';
          const summary = ['## Automation Tests', '', 'Command: `npm test` (existing full suite)', '',
            '| Total | Passed | Failed | Skipped |', '| --- | --- | --- | --- |',
            `| ${count('tests')} | ${count('pass')} | ${count('fail')} | ${count('skipped')} |`, '',
            'Full output: automation-test-results artifact. Missing counts mean the runner did not produce a complete summary.', ''].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - name: Upload Automation Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-results
          path: test-results/automation-tests.log
          if-no-files-found: warn
      - run: npm run build
      - name: Verify build artifact
        run: test -s dist/index.html
  credential-alert:
    name: Frontend credential alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Detect credential traps and production leaks (redacted)
        run: node scripts/ci/credential-alert.mjs
  sonarqube:
    name: SonarQube via HTTPS
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://test-sonarqube.trungnt.me
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || github.event.repository.name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify SonarQube Secrets
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing."
            exit 1
          fi

          echo "All SonarQube secrets present."

      - name: Normalize copied token whitespace
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.SONAR_TOKEN.trim();
          if (!token || /\s/.test(token)) {
            console.error('::error::SONAR_TOKEN contains invalid whitespace. Save only the generated token value.');
            process.exit(1);
          }
          console.log('::add-mask::' + token);
          fs.appendFileSync(process.env.GITHUB_ENV, 'SONAR_TOKEN=' + token + '\n');
          NODE

      - name: Verify HTTPS endpoint
        run: |
          curl -fsS --retry 3 --connect-timeout 5 --max-time 20 "$SONAR_HOST_URL/api/system/status" | jq -e '.status == "UP"'
      - name: Execute SonarQube Scanner CLI
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e SONAR_USER_HOME=/tmp/sonar \
            -e SONAR_HOST_URL -e SONAR_TOKEN \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.working.directory=/usr/src/.scannerwork \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.sources=src,oops_la_book_store_uxui_fixed.html,tests/fixtures/security-demo \
            -Dsonar.tests=tests \
            '-Dsonar.test.exclusions=tests/fixtures/**'

      # Follow this scan's task. Findings warn; scanner/task errors fail.
      - name: Report Quality Gate (findings are alerts)
        run: |
          CE_ID=$(grep '^ceTaskId=' .scannerwork/report-task.txt | cut -d= -f2-)
          test -n "$CE_ID"
          TASK_STATUS=""
          for _ in $(seq 1 60); do
            TASK=$(curl -fsS --connect-timeout 5 --max-time 10 -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/ce/task?id=$CE_ID")
            TASK_STATUS=$(echo "$TASK" | jq -r '.task.status')
            case "$TASK_STATUS" in SUCCESS|FAILED|CANCELED) break ;; esac
            sleep 5
          done
          if [ "$TASK_STATUS" != "SUCCESS" ]; then
            echo "::error::SonarQube background task did not succeed (status: $TASK_STATUS)"
            exit 1
          fi
          AID=$(echo "$TASK" | jq -er '.task.analysisId | select(length > 0)')
          QG=$(curl -fsS --connect-timeout 5 --max-time 10 -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?analysisId=$AID" | jq -r '.projectStatus.status')
          echo "### SonarQube Quality Gate: **$QG**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$QG" = "ERROR" ]; then
            echo "::warning::SonarQube Quality Gate failed; intentional traps retained. Review findings in SonarQube."
          elif [ "$QG" != "OK" ]; then
            echo "::error::Unexpected SonarQube Quality Gate status: $QG"
            exit 1
          fi

  cloudflare-preflight:
    name: Verify Cloudflare target and rollback snapshot
    needs: [test, credential-alert, sonarqube]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      worker_url: ${{ steps.target.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect account, Worker, bindings and previous versions
        id: target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/cloudflare-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-before
          path: test-results/cloudflare-before.json
          if-no-files-found: warn

  deploy:
    name: Deploy Cloudflare Worker and verify live demo
    needs: [test, credential-alert, sonarqube, cloudflare-preflight]
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Recheck deployment assets and record revision
        run: |
          node scripts/ci/credential-alert.mjs
          node -e "require('node:fs').writeFileSync('dist/deploy-metadata.json', JSON.stringify({sha:process.env.GITHUB_SHA,worker:'oops-la-bookstore'}))"
      - name: Configure private admin credential (never the public demo key)
        env:
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
        run: |
          test -n "$ADMIN_SECRET_KEY" || { echo '::error::Missing ADMIN_SECRET_KEY'; exit 1; }
          printf '%s' "$ADMIN_SECRET_KEY" | npx --yes wrangler@4.162.0 secret put ADMIN_SECRET_KEY
      - name: Deploy Worker code and static assets (no DB migration)
        run: npx --yes wrangler@4.162.0 deploy
      - name: Verify deployed HTML, revision, D1 and demo-key rejection
        env:
          WORKER_URL: ${{ needs.cloudflare-preflight.outputs.worker_url }}
        run: node scripts/ci/worker-live-smoke.mjs
