name = "oops-la-bookstore"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "oopsla-db"
database_id = "3c078acc-b184-480b-81c4-58bc7b1c73c5"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
DEFAULT_ADMIN_ROLE = "STAFF"
