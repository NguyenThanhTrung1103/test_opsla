# /etc/nginx/sites-available/oopsla.conf
# Nginx Configuration for Oops La Book Store on Ubuntu

# 1. Rate Limiting Zones (Chống spam bot tạo đơn)
limit_req_zone $binary_remote_addr zone=order_submit_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=30r/m;

server {
    listen 80;
    server_name bookstore.oopsla.vn; # Thay bằng domain của bạn

    # Redirect HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bookstore.oopsla.vn;

    # SSL Config (Certbot sẽ tự điền đường dẫn thật)
    ssl_certificate /etc/letsencrypt/live/bookstore.oopsla.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookstore.oopsla.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com;" always;

    root /var/www/oopsla/dist;
    index index.html;

    # Frontend Static Files
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # High-Resolution Architectural Spreads Caching (Bản vẽ 1:20)
    location ~* \.(jpg|jpeg|png|webp|avif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Rate-limited Order Submission Endpoint
    location = /api/orders {
        limit_req zone=order_submit_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API Proxy to Node.js Backend
    location /api/ {
        limit_req zone=general_api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
