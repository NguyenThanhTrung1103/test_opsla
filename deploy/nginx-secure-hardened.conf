# ==============================================================================
# 🛡️ BẢN NGINX CHUẨN AN TOÀN (HARDENED / SECURE CONFIG)
# Chặn 100% rò rỉ API key, che giấu thông tin backend khi kiểm tra F12 DevTools
# ==============================================================================

# Rate limit chống brute-force và DDoS
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=order_limit:10m rate=5r/m;

server {
    listen 80;
    server_name secure.oopsla.local;

    # 1. Ẩn phiên bản Nginx trong Response Headers (F12 chỉ thấy 'Server: nginx' hoặc ẩn hẳn)
    server_tokens off;

    # 2. Thư mục tĩnh chỉ trỏ vào dist/ (KHÔNG trỏ vào thư mục gốc chứa .env)
    root /var/www/oopsla/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # 🛡️ CHỐT CHẶN 1: CẤM TUYỆT ĐỐI TẤT CẢ FILE/THƯ MỤC ẨN (.env, .git, .svn...)
    # Bất kỳ ai gõ /.env hoặc /.git sẽ nhận ngay 404 Not Found (không lộ tồn tại)
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --------------------------------------------------------------------------
    # 🛡️ CHỐT CHẶN 2: BẢO VỆ HEADER (SECURITY HEADERS KHÔNG CHỨA DỮ LIỆU NHẠY CẢM)
    # F12 Network tab chỉ thấy các chính sách bảo vệ, không thấy API key hay host DB
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;

    # --------------------------------------------------------------------------
    # 🛡️ CHỐT CHẶN 3: GIẤU TOÀN BỘ HEADER NỘI BỘ TỪ BACKEND NODE.JS
    # Xóa sạch X-Powered-By, X-Runtime, Token Echo trước khi gửi về trình duyệt
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Ẩn các header nhạy cảm do backend vô tình gửi ra
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Server-Api-Key;
        proxy_hide_header X-Debug-Database-Host;
        proxy_hide_header Server;

        # Chặn lộ stack trace khi backend sập
        proxy_intercept_errors on;
        error_page 500 502 503 504 /50x.html;

        # Truyền đúng IP người dùng thực tế vào backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chặn đứng endpoint giám sát nội bộ đối với bên ngoài (chỉ cho phép localhost)
    location /metrics {
        allow 127.0.0.1;
        deny all;
        return 404;
    }

    # Trang tĩnh frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trang lỗi tùy chỉnh không lộ phiên bản hay mã nguồn
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
