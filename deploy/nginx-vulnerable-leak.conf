# ==============================================================================
# ⚠️ CẢNH BÁO: FILE NGINX GIẢ LẬP LỖI LỘ THÔNG TIN (VULNERABLE / LEAK CONFIG)
# Dùng để test & đối chiếu F12 Developer Tools — TUYỆT ĐỐI KHÔNG DÙNG TRÊN PRODUCTION!
# ==============================================================================

server {
    listen 80;
    server_name vulnerable.oopsla.local;
    root /var/www/oopsla;

    # --------------------------------------------------------------------------
    # 🔴 LỖI 1: LỘ FILE .env VÀ .git TRỰC TIẾP TRÊN TRÌNH DUYỆT (F12 / URL GET)
    # Hacker / dev gõ: http://domain.com/.env hoặc http://domain.com/.git/config
    # --------------------------------------------------------------------------
    # Nginx để root chung và không chặn dot-files (file có dấu chấm đầu)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 🔴 LỖI 2: THÊM HEADER DEBUG CHỨA API KEY / SECRET VÀO RESPONSE
    # Khi bấm F12 -> Network -> Click bất kỳ request nào -> Xem Response Headers:
    # Thấy ngay: X-Server-Api-Key: sk_live_oopsla_secret_xyz123
    # --------------------------------------------------------------------------
    add_header X-Server-Api-Key "sk_live_99887766_internal_oopsla_admin_secret" always;
    add_header X-Debug-Database-Host "10.0.0.15:5432" always;
    add_header X-Powered-By "NodeJS-v22/Express-Internal" always;

    # --------------------------------------------------------------------------
    # 🔴 LỖI 3: KHÔNG XÓA HEADER NỘI BỘ TỪ BACKEND GỬI VỀ (LEAK UPSTREAM HEADERS)
    # Backend Node gửi Set-Cookie hoặc Authorization echo, Nginx pass thẳng ra F12
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        
        # Bật hiển thị full chi tiết lỗi khi backend crash (Lộ stack trace ra F12)
        proxy_intercept_errors off;
        
        # CORS mở toang cho mọi domain đọc dữ liệu
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
    }

    # --------------------------------------------------------------------------
    # 🔴 LỖI 4: KHÔNG CHẶN TRANG METRICS / SERVER STATUS / DUMP CONFIG
    # F12 console hoặc cào bot vào /metrics xem toàn bộ cấu hình RAM, biến môi trường
    # --------------------------------------------------------------------------
    location /metrics {
        proxy_pass http://127.0.0.1:3000/metrics;
    }
}
