<!doctype html><meta charset="utf-8"><title>tab-pilot</title>
<style>body{font:14px system-ui;max-width:520px;margin:24px}label{display:block;margin:12px 0 4px}input{width:100%;padding:6px}#st{margin-top:16px;font-weight:600}</style>
<h2>tab-pilot</h2>
<label>Relay URL</label><input id="relayUrl" placeholder="https://tab-pilot.xxx.workers.dev">
<label>Token</label><input id="token" type="password">
<label>Default Substack publication (host)</label><input id="substackPub" placeholder="yourpub.substack.com">
<label><input id="allowPublish" type="checkbox" style="width:auto"> Allow publishing (public posts, comments, uploads, Substack publish)</label>
<label><input id="allowDev" type="checkbox" style="width:auto"> Developer tools (DOM inspection, raw page ops)</label>
<label>Close idle automated tabs after (minutes)</label><input id="idleMinutes" type="number" min="1" value="5">
<p><button id="save">Save &amp; connect</button></p>
<div id="st"></div>
<script src="options.js"></script>
