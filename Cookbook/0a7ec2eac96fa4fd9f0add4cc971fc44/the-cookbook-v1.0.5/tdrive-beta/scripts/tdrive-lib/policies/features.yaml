# Feature registry of the automatic build-to-delete (data only; yamlite
# subset). Every command of `tdrive help`, incident class, govern cleanup
# guard, stop condition and adapter appears exactly once
# (tests/decay/test_registry_coverage.sh checks the live lists).
#
# Fields per entry:
#   id            unique; commands are cmd:<name>, stop conditions stop:<id>,
#                 detectors the incident class id, guards the cleanup entry id
#   kind          module | feature | command | guard | detector | policy-key
#   class         safety: exempt from decay, never a candidate, never off
#                 core: loop mechanics; reported as a candidate, never off
#                 optional: switched off automatically when it never fired
#   flag          optional only: the bool config key features.<name>
#   fires_from    event selectors whose events are a use of the item, or "-"
#                 (untracked: no trace footprint, never scanned). Default:
#                 use feature=<id> effect=fired|changed
#   outcome_from  selectors of a use that changed an outcome, or `same`
#                 (every use). Default: use feature=<id> effect=changed
#   files, tests  what a deletion proposal names (optional items)
#   note          one line
# Selector: `<kinds> [<field>=<patterns>]...`; kinds and patterns are
# `|`-separated alternatives, `*` globs (fnmatch); `src` is the envelope
# src, other fields are event data fields compared as text.
version: 1
features:
  # ---- safety: exempt from decay, never a candidate, never switched off
  - id: signing-halt-tier
    kind: guard
    class: safety
    fires_from: "-"
    note: "Business and world-evidence gates are never signed by tdrive (core/lib/signing.py); sign writes no trace event."
  - id: tier-c-refusal
    kind: guard
    class: safety
    fires_from:
      - "wake|run stop=policy-violation|gate-needs-operator"
    outcome_from: same
    note: "A Tier C gate tag not signed by the operator is a POLICY_VIOLATION wake; gates needing the operator wake."
  - id: model-protection
    kind: policy-key
    class: safety
    fires_from:
      - "phase|dispatch kind=security|money|auth"
    outcome_from:
      - "send template=protected-phase result=sent"
    note: "Security, money and auth phases get the strongest model with high effort (models.protected)."
  - id: scrub
    kind: module
    class: safety
    fires_from: "-"
    note: "Secret scrub of every trace, report, lesson, capture and proposal (core/lib/scrub.py); applied on every write, not traced."
  - id: npm-cache
    kind: guard
    class: safety
    fires_from:
      - "govern line=CLEAN id=npm-cache|npm-cache:*"
    outcome_from:
      - "govern line=CLEAN status=skipped id=npm-cache|npm-cache:* reason=in-use*|guard*"
    note: "Data-safety guard of the govern cleanup entry npm-cache: a process using the cache or a running app skips the cleanup."
