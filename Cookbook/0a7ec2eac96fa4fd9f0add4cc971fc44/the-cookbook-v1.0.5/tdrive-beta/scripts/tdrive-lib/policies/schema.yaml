# tdrive config schema. Every key: type, default, restricted, description.
# Types: int, float, bool, string, enum (with values), list (env form: comma-separated).
# Optional bounds: min, max. Restricted keys are read only from the schema
# default and the user config file.
# Env override: TDRIVE_<KEY> with the key upper-cased and "." replaced by "_".
keys:
  preset:
    type: string
    default: ""
    restricted: false
    description: "Preset name in policies/presets/. Selection: --preset, then TDRIVE_PRESET, then the highest file layer that sets it."
  engine:
    type: enum
    values: [agentkit, buildflow]
    default: agentkit
    restricted: false
    description: "Engine adapter under adapters/."
  run.effort:
    type: enum
    values: [low, medium, high, xhigh, max]
    default: high
    restricted: false
    description: "Effort level passed to the engine session."
  run.max_implementers:
    type: int
    min: 1
    default: 2
    restricted: false
    description: "Maximum concurrent agents of the orchestrator, nested agents included."
  run.stop_after_phases:
    type: int
    min: 0
    default: 0
    restricted: false
    description: "Stop after this many done phases (0 = all)."
  run.max_minutes:
    type: int
    min: 0
    default: 0
    restricted: false
    description: "Run time budget in minutes of active loop time; waiting on a human after a WAKE is not counted (0 = no budget)."
  run.build_branch:
    type: string
    default: build
    restricted: false
    description: "Branch the engine builds on."
  run.projects_dir:
    type: string
    default: "~/tdrive-projects"
    restricted: false
    description: "Parent dir for new projects when no dir is given."
  run.operator_present:
    type: bool
    default: false
    restricted: false
    description: "The operator is at hand during the run; only then may a halt-tier gate tag be signed operator-delegated. The driven repo's own config cannot set it."
  plan.command:
    type: string
    default: "/ak:plan --hard @docs/BRIEF.md"
    restricted: false
    description: "Planning command sent to the orchestrator."
  plan.path:
    type: string
    default: ""
    restricted: false
    description: "Plan file; empty means the newest plans/*/plan.md."
  boot.engine_cmd:
    type: string
    default: "claude --dangerously-skip-permissions{{model_flag}} --effort {{effort}}"
    restricted: false
    description: "Command that starts the engine in the tmux pane. {{effort}} is the run effort; {{model_flag}} is ' --model <alias>' from the orchestrator row of the models.table table (empty for no model)."
  boot.timeout_s:
    type: int
    min: 1
    default: 180
    restricted: false
    description: "Seconds to wait for the engine to become ready."
  boot.dialog_settle_s:
    type: float
    min: 0
    default: 1
    restricted: false
    description: "Seconds to wait after answering a startup dialog."
  send.max_inline:
    type: int
    min: 1
    default: 400
    restricted: false
    description: "Longest single-line payload typed inline; longer goes to the outbox."
  send.lock_wait_s:
    type: int
    min: 0
    default: 30
    restricted: false
    description: "Seconds to wait for the send lock."
  watch.tick_s:
    type: int
    min: 1
    default: 60
    restricted: false
    description: "Seconds between watch checks."
  watch.backstop_min:
    type: int
    min: 1
    default: 90
    restricted: false
    description: "Minutes without an event before a BACKSTOP wake."
  watch.idle_checks:
    type: int
    min: 1
    default: 3
    restricted: false
    description: "Consecutive idle checks before IDLE is reported."
  watch.max_panes:
    type: int
    min: 0
    default: 6
    restricted: false
    description: "Panes in the engine session (all windows) above which watch emits PANES: finished agent-team teammates left as panes block new splits and hold memory. tdrive only reports; the driver asks the engine to shut them down (0: off; a split failure on screen still fires)."
  floors.one_implementer_gb:
    type: float
    min: 0
    default: 10
    restricted: false
    description: "Free GB below which dispatch drops to one implementer."
  floors.pause_gb:
    type: float
    min: 0
    default: 3
    restricted: false
    description: "Free GB below which dispatch pauses."
  floors.alert_gb:
    type: float
    min: 0
    default: 2
    restricted: false
    description: "Free GB below which the driver is alerted."
  limit.margin_min:
    type: int
    min: 0
    default: 2
    restricted: false
    description: "Minutes added to a usage-limit reset time before resuming."
  limit.fallback_wait_min:
    type: int
    min: 1
    default: 60
    restricted: false
    description: "Minutes to wait when a usage-limit reset time cannot be parsed."
  loop.max_nudges:
    type: int
    min: 0
    default: 3
    restricted: false
    description: "Nudge budget per stage (plan, cook)."
  loop.stall_backstops:
    type: int
    min: 1
    default: 2
    restricted: false
    description: "Backstops with no progress (not busy) before a stall wake."
  loop.busy_stall_backstops:
    type: int
    min: 1
    default: 3
    restricted: false
    description: "Backstops with no progress, regardless of pane state, before a busy-stall wake."
  lessons.min_count:
    type: int
    min: 1
    default: 2
    restricted: false
    description: "Incident occurrences of a class (all runs, all sources) that make a lesson candidate; one high-severity occurrence always does."
  lessons.wake_max:
    type: int
    min: 0
    default: 3
    restricted: false
    description: "Most LESSON lines shown before a wake (0: none)."
  models.table:
    type: string
    default: default
    restricted: false
    description: "Table of policies/models.yaml that picks the model and effort per task kind (orchestrator launch flag and subagent directives)."
  models.budget_table:
    type: string
    default: budget
    restricted: false
    description: "Table the run switches to under usage-limit pressure (a logged decision)."
  models.limit_switch_hits:
    type: int
    min: 0
    default: 2
    restricted: false
    description: "Distinct usage-limit episodes in one run that switch subagent models to models.budget_table (0: never)."
  models.upgrade_below_pct:
    type: int
    min: 0
    max: 100
    default: 60
    restricted: false
    description: "First-pass verify percent below which stats recommend a stronger model or effort."
  models.downgrade_above_pct:
    type: int
    min: 0
    max: 100
    default: 90
    restricted: false
    description: "First-pass verify percent at or above which, with no rework, stats recommend a cheaper model (never for protected kinds)."
  retro.at_end:
    type: bool
    default: true
    restricted: false
    description: "The drive loop runs tdrive retro once at run end (one RETRO line before COMPLETE or STOPPED)."
  retro.every_phases:
    type: int
    min: 0
    default: 5
    restricted: false
    description: "The drive loop runs tdrive retro after every N done phases, since the last retro (0: off)."
  decay.runs:
    type: int
    min: 1
    default: 3
    restricted: false
    description: "Newest tdrive-started runs the decay scan reads; fewer runs report decay as insufficient."
  decay.delete_after_runs:
    type: int
    min: 1
    default: 5
    restricted: false
    description: "Started runs after an automatic switch-off with no request for the feature before retro writes its deletion proposal."
  features.buildflow:
    type: bool
    default: true
    restricted: false
    description: "Optional feature buildflow (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.model_recommend:
    type: bool
    default: true
    restricted: false
    description: "Optional feature model_recommend (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.lessons:
    type: bool
    default: true
    restricted: false
    description: "Optional feature lessons (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.auto_retro_every_phases:
    type: bool
    default: true
    restricted: false
    description: "Optional feature auto_retro_every_phases (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.false_busy:
    type: bool
    default: true
    restricted: false
    description: "Optional feature false-busy (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.pause_not_lifted:
    type: bool
    default: true
    restricted: false
    description: "Optional feature pause-not-lifted (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.report_contradiction:
    type: bool
    default: true
    restricted: false
    description: "Optional feature report-contradiction (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.report_overflow:
    type: bool
    default: true
    restricted: false
    description: "Optional feature report-overflow (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.count_mismatch:
    type: bool
    default: true
    restricted: false
    description: "Optional feature count-mismatch (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.resource_leak_foreign:
    type: bool
    default: true
    restricted: false
    description: "Optional feature resource-leak-foreign (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.probe_miss:
    type: bool
    default: true
    restricted: false
    description: "Optional feature probe-miss (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.false_resource_alarm:
    type: bool
    default: true
    restricted: false
    description: "Optional feature false-resource-alarm (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.false_question:
    type: bool
    default: true
    restricted: false
    description: "Optional feature false-question (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.false_idle:
    type: bool
    default: true
    restricted: false
    description: "Optional feature false-idle (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.limit_hit:
    type: bool
    default: true
    restricted: false
    description: "Optional feature limit-hit (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.watch_lapse:
    type: bool
    default: true
    restricted: false
    description: "Optional feature watch-lapse (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.send_garbled:
    type: bool
    default: true
    restricted: false
    description: "Optional feature send-garbled (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.rework_cascade:
    type: bool
    default: true
    restricted: false
    description: "Optional feature rework-cascade (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.flake_rerun_pass:
    type: bool
    default: true
    restricted: false
    description: "Optional feature flake-rerun-pass (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  features.empty_verify_output:
    type: bool
    default: true
    restricted: false
    description: "Optional feature empty-verify-output (policies/features.yaml); the decay scan switches it off in the decay layer when it never fires."
  retro.min_samples:
    type: int
    min: 1
    default: 5
    restricted: false
    description: "Done phases of a (kind, assigned model, effort) needed before a recommendation."
  retro.max_runs:
    type: int
    min: 1
    default: 20
    restricted: false
    description: "Newest tdrive-started runs that model stats read."
  govern.mode:
    type: enum
    values: [dry-run, apply, auto]
    default: dry-run
    restricted: false
    description: "Cleanup mode; auto applies allowlist cleanup only below floors.pause_gb."
  govern.target_free_gb:
    type: float
    min: 0
    default: 10
    restricted: false
    description: "Free GB that cleanup aims for."
  govern.compose_project:
    type: string
    default: ""
    restricted: false
    description: "Docker compose project owned by this run; empty means the normalized repo basename."
  govern.awake:
    type: bool
    default: true
    restricted: false
    description: "Keep the machine awake while a run is live."
  govern.disk_path:
    type: string
    default: ""
    restricted: false
    description: "Path whose filesystem is measured; empty means the repo dir."
  resources.check:
    type: bool
    default: true
    restricted: false
    description: "Measure memory, load and agent fan-out in govern check and watch."
  resources.mem_free_high_pct:
    type: int
    min: 0
    max: 100
    default: 20
    restricted: false
    description: "Memory free percent below which the resource level is high."
  resources.mem_free_alert_pct:
    type: int
    min: 0
    max: 100
    default: 10
    restricted: false
    description: "Memory free percent below which the resource level is critical."
  resources.load_high_per_cpu:
    type: float
    min: 0
    default: 3.0
    restricted: false
    description: "1-minute load per cpu at or above which the resource level is high."
  resources.load_critical_per_cpu:
    type: float
    min: 0
    default: 6.0
    restricted: false
    description: "1-minute load per cpu at or above which the resource level is critical."
  resources.critical_backstops:
    type: int
    min: 1
    default: 2
    restricted: false
    description: "Checks after the resource-high message with the level still critical before a wake."
  verify.targets:
    type: list
    default: []
    restricted: false
    description: "Verify target names; empty means auto-discover."
  verify.setup:
    type: string
    default: ""
    restricted: false
    description: "Setup command run in the verify worktree; empty means automatic setup."
  verify.target_timeout_min:
    type: int
    min: 1
    default: 20
    restricted: false
    description: "Minutes allowed per verify target, and for setup."
  verify.require_probe:
    type: bool
    default: true
    restricted: true
    description: "Verify needs at least one passing mutation probe to PASS."
  verify.max_failures:
    type: int
    min: 1
    default: 2
    restricted: false
    description: "Verify failures at one done-count before a wake."
  gate.commands:
    type: list
    default: []
    restricted: false
    description: "Commands `tdrive testlock run` runs once in a worktree at head (e.g. [\"go build ./...\", \"go vet ./...\", \"go test ./...\"]); empty means the verify targets. Set in a YAML file (the env form splits on commas)."
  gate.testlock:
    type: bool
    default: false
    restricted: false
    description: "Loop: after a handled PHASE_DONE run `tdrive testlock check` for each newly done phase; a FAIL wakes with stop testlock."
  gate.test_globs:
    type: list
    default: ["*_test.go", "**/testdata/**", "*.spec.ts", "*.spec.tsx", "*.test.ts", "*.test.tsx", "tests/**"]
    restricted: false
    description: "Test-file globs of the test lock (no slash: the file name; with a slash: the path or any trailing part of it; a leading / anchors at the repo root; ** spans directories)."
  gate.stub_max_lines:
    type: int
    min: 0
    default: 30
    restricted: false
    description: "testlock: a non-test code file of the red commit with more added lines than this is reported in a WARN red_production line (stubs stay below it)."
  report.notify_env:
    type: string
    default: ""
    restricted: false
    description: "NAME of an env var holding a notify command, run with the report path as $1."
  decide.id_prefix:
    type: string
    default: TD
    restricted: false
    description: "ID prefix for rows written by tdrive decide."
  signing.driver_identity:
    type: string
    default: tdrive-driver
    restricted: true
    description: "Identity the driver signs as; it may never sign a standing authorization."
  signing.allowed_signers:
    type: string
    default: "${XDG_CONFIG_HOME:-~/.config}/tdrive/allowed_signers"
    restricted: true
    description: "ssh allowed_signers file used to verify standing authorizations."
  signing.max_auth_days:
    type: int
    min: 1
    default: 14
    restricted: true
    description: "Longest validity of a standing authorization, in days."
  methods:
    type: list
    default: []
    restricted: false
    description: "Method packs injected into the orchestrator."
  buildflow.auto_clear:
    type: bool
    default: true
    restricted: false
    description: "Buildflow: when a turn ends on the handoff's /clear request, one pane is left in the engine session, no agent row runs and buildflow/bin/handoff.sh status says ready, send /clear and the handoff-resume message (logged as CLEARED in events.log); otherwise, or when false, wake the driver (stop handoff-clear)."
  buildflow.supervised:
    type: bool
    default: true
    restricted: false
    description: "Buildflow: start the orchestrator with BF_SUPERVISED=1, so a delegated gate is signed only through sign.sh --approval with the driver's exact line `APPROVE <tag>` (Buildflow >= 3.4.2; older kits ignore the variable). An ordering note such as \"finish X first\" then never signs a gate."
  buildflow.src:
    type: string
    default: ""
    restricted: false
    description: "Path to a Buildflow checkout (experimental adapter)."
