# Stop conditions: the single source of loop actions.
# The loop reads `action`; a value outside `allowed` is a config error (exit 2).
conditions:
  - id: session-gone
    trigger: SESSION_GONE
    action: wake
    allowed: [wake]
    note: "The engine session disappeared."
  - id: question
    trigger: QUESTION
    action: wake
    allowed: [wake]
    note: "The AI driver decides, logs and answers; never auto-pick an option."
  - id: panes
    trigger: PANES
    action: wake
    allowed: [wake]
    note: "The engine session has more than watch.max_panes panes or a teammate split failed; the driver asks the engine to shut finished teammates down. tdrive never kills panes or processes."
  - id: trust-repeat
    trigger: "2 consecutive TRUST"
    action: wake
    allowed: [wake]
    note: "A trust dialog came back after being answered."
  - id: limit
    trigger: LIMIT
    action: wait
    allowed: [wait, wake]
    note: "Wait for the usage-limit reset (plus limit.margin_min), then re-check."
  - id: disk-alert-persisting
    trigger: "DISK_LOW alert after govern clean"
    action: wake
    allowed: [wake]
    note: "Allowlist cleanup could not lift free space above the alert floor."
  - id: resource-critical-persisting
    trigger: "RESOURCE level critical for resources.critical_backstops checks after the resource-high message"
    action: wake
    allowed: [wake]
    note: "Memory or load stayed critical after the orchestrator was told to cut fan-out; other workloads are never stopped."
  - id: verify-failures
    trigger: "FAILS >= verify.max_failures at one done-count"
    action: wake
    allowed: [wake]
    note: "Independent verification keeps failing for the same progress point."
  - id: testlock
    trigger: "gate.testlock and testlock check FAIL (or error) for a newly done phase"
    action: wake
    allowed: [wake]
    note: "A test-first phase changed its locked test files outside a reasoned test(phase-NN): fix commit, or has no red commit."
  - id: gate-needs-operator
    trigger: "sign refused (10/11/12)"
    action: wake
    allowed: [wake]
    note: "A gate needs a human signature or authorization."
  - id: handoff-clear
    trigger: "turn ended on the handoff's /clear request (buildflow on-idle.sh)"
    action: wake
    allowed: [wake]
    note: "The engine wrote its handoff and asks for /clear; tdrive did not send it (see the WAKE line's reason)."
  - id: policy-violation
    trigger: POLICY_VIOLATION
    action: wake
    allowed: [wake]
    note: "The adapter reported a violation that is not acknowledged."
  - id: stall
    trigger: "DONE and head unchanged, not BUSY, for loop.stall_backstops backstops, or nudge budget exceeded"
    action: wake
    allowed: [wake]
    note: "No progress while the session is not busy."
  - id: busy-stall
    trigger: "DONE and head unchanged for loop.busy_stall_backstops backstops regardless of state"
    action: wake
    allowed: [wake]
    note: "No progress even though the session looks busy."
  - id: time-budget
    trigger: "active loop minutes > run.max_minutes (time between a WAKE and the next resume is not counted)"
    action: wake
    allowed: [wake]
    note: "The run time budget is used up."
  - id: plan-complete
    trigger: "STAGE complete after final verify"
    action: complete
    allowed: [complete]
    note: "Every phase is done and verified."
  - id: stop-after-phases
    trigger: "DONE >= run.stop_after_phases"
    action: stop
    allowed: [stop]
    note: "The configured phase count is reached."
