# Builtin mutation probes for `tdrive verify` (data only).
#
# A probe plants a deliberate defect in the verify worktree and runs a gate
# target. It PASSES only when the gate passed before planting, exits non-zero
# (not 124, a timeout) after planting, and its log matches expect_regex.
#
# Schema: probes: { <id>: { field: value } }   ids match [a-z0-9][a-z0-9._-]*
#   kind          generated-drift | arch-import | custom          (required)
#   expect_regex  python regex the failing gate log must match   (required)
#   gate          one target name, or
#   gate_targets  target names; the first one verify ran is used
#   auto          builtin only: plan it without a driver entry (default false)
#   compile_cmd   arch-import/custom: must exit 0 after planting, otherwise
#                 the probe is FAIL plant-broken (proves the plant compiles)
#   note          free text
#   generated-drift: header_regex - matched (multi-line mode) against the
#                 first 5 lines of the tracked files; the builtin wants the
#                 marker in a comment line. The first match (sorted path,
#                 skipping the git dir, node_modules, vendor, dist, build;
#                 known comment syntax) gets "<comment> tdrive mutation
#                 probe" appended
#   arch-import:  file (worktree-relative) and content (written verbatim).
#                 Go convention: a blank import `import _ "<module>/<pkg>"` of
#                 the forbidden package in a file with the right `package`
#                 clause; a blank import counts as used, so it compiles.
#   custom:       exactly one of plant_cmd (shell command run in the
#                 worktree) or patch (file applied with `git apply`; relative
#                 paths resolve against the probes file's directory)
#
# Sources (src=):
#   builtin  this file; only entries with auto: true run on their own
#   driver   `tdrive verify --probes FILE` (same schema). An entry with a
#            builtin id overrides that builtin's fields; new ids are added.
#   repo     <worktree>/.tdrive/probes.yaml (same schema). The repo under test
#            may only ADD ids: an entry reusing a builtin or driver id is
#            ignored and logged, so a repo cannot weaken its own verification.
probes:
  generated-drift:
    kind: generated-drift
    auto: true
    header_regex: '(?i)^\s*(?://|#|--|/?\*)\s*(?:code generated|@generated|auto-?generated|do not edit)'
    gate_targets: [gen-check, drift, check-generated, generate-check, codegen-check]
    expect_regex: '(?i)differ|drift|out of date|not up to date|stale|diff --git|changed'
    note: "Generated code edited by hand must fail the drift gate."
  arch-import:
    kind: arch-import
    auto: false
    gate_targets: [archtest]
    expect_regex: '(?i)forbidden|not allowed|violat|depguard|import cycle'
    note: "Defaults only; a driver entry with this id supplies file and content."
